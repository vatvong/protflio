<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table style</title>
    <style>
        table{
            width: 100%;
        }
        table {
            border-collapse: collapse;
        }

        table th{
            background-color: forestgreen;
            text-align: left;

        }
        tr:nth-child(odd){
            background-color: rgb(209, 223, 237);
        }
    </style>
</head>
<body>
    <table align="center" class="style-table" border="1">
        <thead>
            <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>country</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alfreds Futtrkise</td>
                <td>Maria Anders</td>
                <td>Gemany</td>
            </tr>
            <tr>
                <td>Berglunds snabbkop</td>
                <td>Chrisna Berglund</td>
                <td>Sweden</td>
            </tr>
            <tr>
                <td>Centro comercial Moctezuma</td>
                <td>Franciso chang</td>
                <td>Mexico</td>
            </tr>
            <tr>
                <td>Emst Handel</td>
                <td>Roland Medel</td>
                <td>Austria</td>
            </tr>
            <tr>
                <td>Island Trading</td>
                <td>Helen Bennert</td>
                <td>UK</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
