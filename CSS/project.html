<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
    
     * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #fff;
        color: #333;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 60px;
    }

    nav h2 {
        color: #f06445;
    }

    nav a {
        margin: 0 15px;
        text-decoration: none;
        color: #555;
    }

    .main-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 100px 60px;
    }

    .content {
        width: 50%;
    }

    .content p {
        color: #f06445;
        font-weight: bold;
    }

    h1 {
        font-size: 60px;
        margin: 20px 0;
    }

    h1 span {
     color: #f06445;
    }
    h3 span {
        color: black;
    }

    .content h3 {
        color: #777;
        line-height: 1.6;
        font-weight: normal;
    }

    button {
        margin-top: 30px;
        padding: 15px 30px;
        border: none;
        border-radius: 30px;
        background: black;
        color: white;
        cursor: pointer;
    }

    .buttons {
        display: flex;
        align-items: center;
        gap: 25px;
    }
    
    .main-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 1px solid #eee;
        background: white;
        font-size: 35px;
        cursor: pointer;
    }

    .hire-btn {
        height: 80px;
        padding: 0 35px;
        border: none;
        border-radius: 45px;
        background: #f06423;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    .hire-btn span {
        margin-left: 15px;
        font-size: 28px;
    }

    .hire-btn:hover {
        background: #d95116;
    }

    .stats-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 40px 20px;
        font-family: sans-serif;
        text-align: center;
    }

    .stat-item h3 {
        font-size: 48px; 
        color: black; 
        margin: 0 0 10px 0;
    }

    .stat-item p {
        font-size: 16px;
        color: #7f8c8d; 
        margin: 0;
    }

    .image {
        width: 40%;
    }

    .image img {
        width: 100%;
        border-radius: 25px;
    }
    .main{ 
        display: grid;
        gap: 10px;
        padding: 10px;
        grid-template-columns: repeat(3,1fr);
        grid-template-rows: 400px;
    } 
      
    .box {
       background-color: #fff; 
    }
    .box1 {
        flex-wrap: nowrap;
    }
    </style>
</head>

<body>

    <nav>
        <h2>vong</h2>

        <div>
            <a href="#">Services</a>
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Reviews</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
            
        </div>
        <div class="buttons">
            <button class="main-btn"></button>
            <button class="hire-btn">Hire me <span>→</span></button>
        </div>
    </nav>

    <section class="main-content">
        <div class="content">
            <p>AVAILABLE FOR WORK</p>
            <h1>Hi, I'm <span>vong</span></h1>
            <h3>Freelance <span>UI/UX Designer & Frontend Developer.</span> I design and build digital products that people love to us-fast. clean, and accessible.</h3>
            <button>View my work <span>→</span></button>
            <button class="main-button">Get in touch</button>
            <section  class="stats-container">
                <div class="stat-item">
                    <h3>34+</h3>
                    <p>projects done</p>
                </div>
                 <div class="stat-item">
                    <h3>21+</h3>
                    <p>Happy clients</p>
                </div>
                <div class="stat-item">
                    <h3>5y</h3>
                    <p>Expereince</p>
                </div>
            </section>
        </div>

        <div class="image-box">
            <img src="myphoto.jpg" alt="">
            <button>Open to project</button>
        </div>
    </section>
    <section class="main-content">
        <div class="content">
            <p>WHAT I DO</p>
            <h1>Services</h1>
        </div>
        <main>
           <div class="box box1"></div> 
           <div class="box box2"></div> 
           <div class="box box3"></div> 
        </main>
        </section>
    </section>

</body>
</html>
    
</body>
    <script scr="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.esm.min.js"></script> 
</html>
