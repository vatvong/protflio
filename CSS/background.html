<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
             margin: 0;
            padding: 0;
            box-sizing: border-box;  
        }
        .main-box{
            width: 100%;
            height: 500px;
            background-color: lightblue;
            background-image: url(https://i.pinimg.com/736x/00/9a/7d/009a7d970fbc46f5acbbe3e721d7c07e.jpg);
            background-repeat: no-repeat;
            background-size: contain;
            background-attachment: scroll;
        }
        .box{
            color: green;
        }
    </style>
</head>
<body>
    <main>
        <section class="main-box">
            <div class="box">
                <h1>ENHYPEN</h1>
            </div>
        </section>
    </main>
</body>
</html>
